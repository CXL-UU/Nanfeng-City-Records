<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="南风市 · 我的世界建筑作品与收藏集：区域规划、背景故事、使用模组、作品展览与建造日志。">
<meta name="theme-color" content="#0d1b2a">
<meta property="og:type" content="website">
<meta property="og:title" content="南风市 · 我的世界建筑作品与收藏集">
<meta property="og:description" content="收藏服务器里最用心的建筑作品、世界观设定与团队故事。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%2312324a'/%3E%3Crect x='12' y='1' width='3' height='3' fill='%23ffd24a'/%3E%3Crect x='1' y='10' width='3' height='6' fill='%235dd35d'/%3E%3Crect x='5' y='7' width='4' height='9' fill='%233aa43a'/%3E%3Crect x='10' y='9' width='4' height='7' fill='%232f8f2f'/%3E%3C/svg%3E">
<script>
/* 首屏前先确定主题，避免闪烁 */
(function(){
  var d = document.documentElement; d.classList.add('js');
  var t = null;
  try{ t = localStorage.getItem('mc_theme'); }catch(e){}
  if(t !== 'day' && t !== 'night'){ var h = new Date().getHours(); t = (h >= 6 && h < 18) ? 'day' : 'night'; }
  d.setAttribute('data-theme', t);
})();
</script>
<title>南风市 · 我的世界建筑作品与收藏集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"></noscript>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 南风市 Logo -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="nanfeng-logo" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect width="16" height="16" fill="#12324a"/>
    <rect y="9" width="16" height="7" fill="#17405c"/>
    <rect x="12" y="1" width="3" height="3" fill="#ffd24a"/>
    <rect x="12" y="1" width="1" height="1" fill="#fff3b0"/>
    <rect x="1" y="2" width="6" height="1" fill="#e8f6ff"/>
    <rect x="7" y="1" width="2" height="1" fill="#e8f6ff"/>
    <rect x="9" y="2" width="1" height="1" fill="#e8f6ff"/>
    <rect x="0" y="4" width="5" height="1" fill="#bfe3f7"/>
    <rect x="5" y="3" width="2" height="1" fill="#bfe3f7"/>
    <rect x="7" y="4" width="1" height="1" fill="#bfe3f7"/>
    <rect x="1" y="10" width="3" height="6" fill="#5dd35d"/>
    <rect x="5" y="7" width="4" height="9" fill="#3aa43a"/>
    <rect x="6" y="6" width="2" height="1" fill="#ffd24a"/>
    <rect x="10" y="9" width="4" height="7" fill="#2f8f2f"/>
    <rect x="2" y="12" width="1" height="1" fill="#ffd24a"/>
    <rect x="6" y="9" width="1" height="1" fill="#ffd24a"/>
    <rect x="7" y="11" width="1" height="1" fill="#ffd24a"/>
    <rect x="6" y="13" width="1" height="1" fill="#ffd24a"/>
    <rect x="11" y="11" width="1" height="1" fill="#ffd24a"/>
    <rect x="12" y="13" width="1" height="1" fill="#ffd24a"/>
  </symbol>
</svg>

<!-- 添加建造日志表单 -->
<div id="logModal" class="modal">
  <form class="lock-card form-card glass" id="logFormEl" autocomplete="off">
    <h2>＋ 添加建造日志</h2>
    <label>日期<input type="date" id="lfDate"></label>
    <label>版本号 / 阶段标签<input type="text" id="lfStage" maxlength="30" placeholder="如 v0.3 主体结构"></label>
    <label>分类
      <select id="lfCat"><option>建筑</option><option>轨道交通</option><option>道路</option><option>地形</option><option>优化</option></select>
    </label>
    <label>标题<input type="text" id="lfTitle" maxlength="60" placeholder="这次的主题"></label>
    <label>正文（这次干了什么）<textarea id="lfBody" rows="4" placeholder="写下这次的进展、遇到的问题、用到的方块…"></textarea></label>
    <div class="form-label">建造人员（可多选，也可不选）<div class="pick-list" id="lfBuilders"></div></div>
    <label>图片链接（可留空，留空则不显示图片）<input type="text" id="lfImg" placeholder="https://..."></label>
    <div id="lfMsg"></div>
    <div class="row">
      <button class="px-btn" type="submit">发布</button>
      <button class="px-btn gray" type="button" id="lfCancel">取消</button>
    </div>
  </form>
</div>

<!-- 选择建造人员 -->
<div id="pickModal" class="modal">
  <div class="lock-card form-card glass" role="dialog" aria-label="选择建造人员">
    <h2>👷 选择建造人员</h2>
    <p class="pick-hint">可单选或多选，名单来自页面下方「人员规划」。</p>
    <div class="pick-list" id="pickList"></div>
    <div class="row">
      <button class="px-btn" id="pickOk" type="button">确定</button>
      <button class="px-btn gray" id="pickClear" type="button">清空</button>
      <button class="px-btn gray" id="pickCancel" type="button">取消</button>
    </div>
  </div>
</div>

<!-- 密码锁 -->
<div id="lock" class="hide">
  <div class="lock-card glass">
    <svg class="logo big" aria-hidden="true"><use href="#nanfeng-logo"/></svg>
    <h2>🔒 南风市 · 编辑权限验证</h2>
    <p>输入密码进入编辑模式。</p>
    <input type="password" id="pwd" placeholder="请输入密码" autocomplete="off">
    <div id="lockMsg"></div>
    <div class="row">
      <button class="px-btn" id="btnLogin" type="button">进入编辑</button>
      <button class="px-btn gray" id="btnGuest" type="button">取消</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
  <img src="" alt="">
  <button class="lb-nav lb-prev" type="button" aria-label="上一张">‹</button>
  <button class="lb-nav lb-next" type="button" aria-label="下一张">›</button>
  <button class="lb-nav lb-close" type="button" aria-label="关闭">✕</button>
  <div class="lb-count"></div>
</div>

<div id="app">
  <div class="bg" id="bg"></div>

  <header class="top glass">
    <div class="brand">
      <svg class="logo" aria-label="南风市 Logo" role="img"><use href="#nanfeng-logo"/></svg>
      <div class="name">
        <h1 data-bind="meta.siteTitle" data-edit contenteditable="false">南风市</h1>
        <span class="sub" data-bind="meta.siteSub" data-edit contenteditable="false">NANFENG CITY · 建筑收藏集</span>
      </div>
    </div>
    <nav class="menu">
      <a href="#home">主页</a>
      <a href="#map">区域规划</a>
      <a href="#story">背景故事</a>
      <a href="#mods">使用模组</a>
      <a href="#gallery">作品展览</a>
      <a href="#log">建造日志</a>
      <a href="#team">建造人员</a>
    </nav>
  </header>

  <main>
    <section id="home">
      <div class="hero glass">
        <svg class="logo big" aria-hidden="true"><use href="#nanfeng-logo"/></svg>
        <div class="pixel-tag" data-bind="meta.heroTag" data-edit contenteditable="false">MINECRAFT BUILD SHOWCASE</div>
        <h2 data-bind="meta.heroTitle" data-edit contenteditable="false">欢迎来到南风市</h2>
        <p data-bind="meta.heroDesc" data-edit contenteditable="false">这里收藏着服务器里最用心的建筑作品、世界观设定与团队故事。向下滚动，开始你的参观之旅。</p>
        <div class="go">
          <a class="px-btn" href="#gallery">▶ 浏览作品</a>
          <a class="px-btn gray" href="#map">⌖ 查看地图</a>
        </div>
      </div>
    </section>

    <section id="map">
      <div class="sec-title"><h2><span class="en"></span><span data-edit contenteditable="false"></span></h2></div>
      <div class="split glass">
        <div class="media">
          <div class="img-wrap">
            <img src="" alt="区域规划地图" loading="lazy" decoding="async" referrerpolicy="no-referrer">
            <button class="swap-btn edit-only" data-act="swap" type="button">✎ 换图</button>
          </div>
        </div>
        <div class="text">
          <div data-edit contenteditable="false"></div>
          <div class="tools edit-only"><button class="px-btn small gray" data-act="flip" type="button">⇄ 切换图文左右</button></div>
        </div>
      </div>
    </section>

    <section id="story">
      <div class="sec-title"><h2><span class="en"></span><span data-edit contenteditable="false"></span></h2></div>
      <div class="split glass reverse">
        <div class="media">
          <div class="img-wrap">
            <img src="" alt="背景故事插图" loading="lazy" decoding="async" referrerpolicy="no-referrer">
            <button class="swap-btn edit-only" data-act="swap" type="button">✎ 换图</button>
          </div>
        </div>
        <div class="text">
          <div data-edit contenteditable="false"></div>
          <div class="tools edit-only"><button class="px-btn small gray" data-act="flip" type="button">⇄ 切换图文左右</button></div>
        </div>
      </div>
    </section>

    <section id="mods">
      <div class="sec-title">
        <h2><span class="en" data-bind="sectionTitles.mods.en"></span><span data-bind="sectionTitles.mods.title" data-edit contenteditable="false"></span></h2>
        <button class="px-btn small edit-only" data-act="add-mod" type="button">＋ 添加模组</button>
      </div>
      <div class="tl-filters" data-g="mod">
        <button class="chip active" data-act="filter" data-f="all" type="button">全部</button>
        <button class="chip" data-act="filter" data-f="主力模组" type="button">主力模组</button>
        <button class="chip" data-act="filter" data-f="装饰模组" type="button">装饰模组</button>
        <button class="chip" data-act="filter" data-f="材质光影" type="button">材质光影</button>
      </div>
      <div class="grid" id="modGrid"></div>
    </section>

    <section id="gallery">
      <div class="sec-title">
        <h2><span class="en" data-bind="sectionTitles.gallery.en"></span><span data-bind="sectionTitles.gallery.title" data-edit contenteditable="false"></span></h2>
        <button class="px-btn small edit-only" data-act="add-gal" type="button">＋ 添加作品</button>
      </div>
      <div class="tl-filters" data-g="gal">
        <button class="chip active" data-act="filter" data-f="all" type="button">全部</button>
        <button class="chip" data-act="filter" data-f="单体建筑" type="button">单体建筑</button>
        <button class="chip" data-act="filter" data-f="多体建筑" type="button">多体建筑</button>
        <button class="chip" data-act="filter" data-f="建筑群" type="button">建筑群</button>
        <button class="chip" data-act="filter" data-f="地形" type="button">地形</button>
        <button class="chip" data-act="filter" data-f="道路" type="button">道路</button>
        <button class="chip" data-act="filter" data-f="轨道" type="button">轨道</button>
        <button class="chip" data-act="filter" data-f="大型建筑群" type="button">大型建筑群</button>
      </div>
      <div class="grid" id="galGrid"></div>
    </section>

    <section id="log">
      <div class="sec-title">
        <h2><span class="en" data-bind="sectionTitles.log.en"></span><span data-bind="sectionTitles.log.title" data-edit contenteditable="false"></span></h2>
        <button class="px-btn small edit-only" data-act="add-log" type="button">＋ 添加日志</button>
        <button class="px-btn small gray edit-only" data-act="log-sort" type="button">⇅ 按日期排序</button>
      </div>
      <div class="tl-filters" data-g="log">
        <button class="chip active" data-act="filter" data-f="all" type="button">全部</button>
        <button class="chip" data-act="filter" data-f="建筑" type="button">建筑</button>
        <button class="chip" data-act="filter" data-f="轨道交通" type="button">轨道交通</button>
        <button class="chip" data-act="filter" data-f="道路" type="button">道路</button>
        <button class="chip" data-act="filter" data-f="地形" type="button">地形</button>
        <button class="chip" data-act="filter" data-f="优化" type="button">优化</button>
      </div>
      <div class="tl" id="tl"></div>
    </section>

    <section id="team" class="team">
      <div class="sec-title">
        <h2><span class="en" data-bind="sectionTitles.team.en"></span><span data-bind="sectionTitles.team.title" data-edit contenteditable="false"></span></h2>
        <button class="px-btn small edit-only" data-act="add-member" type="button">＋ 添加成员</button>
      </div>
      <div class="grid" id="teamGrid"></div>
    </section>
  </main>

  <footer data-bind="meta.footer" data-edit contenteditable="false">© 2026 南风市建筑收藏集 · Not an official Minecraft product.</footer>
</div>

<div id="toolbar" class="glass edit-only">
  <button class="px-btn small" data-act="save" type="button">💾 保存草稿</button>
  <button class="px-btn small" data-act="export-js" type="button">⬇ 导出 data.js</button>
  <button class="px-btn small gray" data-act="bg" type="button">🖼 设置背景图</button>
  <button class="px-btn small danger" data-act="reset" type="button">↺ 重置</button>
</div>
<button id="authBtn" class="px-btn small gray" type="button" title="编辑登录" aria-label="编辑登录">🔑</button>

<script src="data.js"></script>
<script>
(function(){
  'use strict';
  /* ============ 配置 ============ */
  var PASSWORD = 'a1472880';
  var DRAFT_KEY = 'mc_draft_v3';

  var $ = function(s,r){return (r||document).querySelector(s)};
  var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  var app = $('#app'), editing = false;

  /* ============ 数据层 ============ */
  var fileData = window.MC_DATA || {
    meta:{}, sections:{}, sectionTitles:{}, mods:[], gallery:[], team:[], logs:[]
  };
  var currentData;

  function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

  function loadInitialData(){
    // 内容永远以 data.js 为准，本地草稿不再静默覆盖，保证所有人看到同一份内容
    return deepClone(fileData);
  }
  currentData = loadInitialData();

  /* ============ 工具 ============ */
  var toastTimer;
  function toast(msg, err){
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'show' + (err ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.className = ''; }, 2000);
  }
  function esc(s){return String(s == null ? '' : s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function textOf(el){
    if(!el) return '';
    var v = (el.innerText != null ? el.innerText : el.textContent);
    return v.replace(/^\s+|\s+$/g, '');
  }
  function getPath(obj, path){
    var parts = path.split('.'), o = obj;
    for(var i=0;i<parts.length;i++){ if(o == null) return undefined; o = o[parts[i]]; }
    return o;
  }
  function setPath(obj, path, v){
    var parts = path.split('.'), o = obj;
    for(var i=0;i<parts.length-1;i++){
      if(o[parts[i]] == null || typeof o[parts[i]] !== 'object') o[parts[i]] = {};
      o = o[parts[i]];
    }
    o[parts[parts.length-1]] = v;
  }
  function rt(el){ el.setAttribute('data-rt',''); return el; }
  function imgSrcOf(el){
    var im = el ? $('.img-wrap img', el) : null;
    return im ? (im.getAttribute('src') || '') : '';
  }

  /* ============ 模板 ============ */
  function imgWrapHTML(cls, alt, src){
    return '<div class="img-wrap ' + (cls||'') + '">' +
      '<img src="' + esc(src || '') + '" alt="' + esc(alt||'') + '" loading="lazy" decoding="async" referrerpolicy="no-referrer">' +
      '<button class="swap-btn edit-only" data-act="swap" type="button">✎ 换图</button>' +
    '</div>';
  }
  function logImgHTML(src){
    return '<div class="img-wrap wide">' +
      '<img src="' + esc(src || '') + '" alt="日志配图" loading="lazy" decoding="async" referrerpolicy="no-referrer">' +
      '<button class="swap-btn edit-only" data-act="swap" type="button">✎ 换图</button>' +
    '</div>';
  }
  function buildersHTML(arr){
    arr = Array.isArray(arr) ? arr : [];
    return '<div class="builders' + (arr.length ? '' : ' empty') + '" data-builders="' + esc(JSON.stringify(arr)) + '">' +
      '<span class="b-label">建造</span>' +
      '<span class="b-list">' + arr.map(function(n){ return '<span class="b-chip">' + esc(n) + '</span>'; }).join('') + '</span>' +
      '<button class="px-btn small gray edit-only" data-act="pick-builders" type="button">👷 选择建造人员</button>' +
    '</div>';
  }
  var CARD = {
    mod:{grid:'#modGrid', sel:'[data-type="mod"]', cats:['主力模组', '装饰模组', '材质光影']},
    gal:{grid:'#galGrid', sel:'[data-type="gal"]', cats:['单体建筑', '多体建筑', '建筑群', '地形', '道路', '轨道', '大型建筑群']}
  };
  var cardFilter = {mod:'all', gal:'all'};
  function cardCat(g, c){ var cs = CARD[g].cats; return cs.indexOf(c) < 0 ? cs[0] : c; }
  function catChipHTML(g, c){
    c = cardCat(g, c);
    return '<button class="cat-chip" data-act="card-cat" data-g="' + g + '" data-c="' + esc(c) + '" type="button" title="编辑模式下点击切换分类">' + esc(c) + '</button>';
  }
  function tplMod(m){
    m = m || {};
    return '<article class="item glass" data-type="mod" data-cat="' + esc(cardCat('mod', m.cat)) + '">' +
      '<div class="tag-row">' + catChipHTML('mod', m.cat) + '</div>' +
      '<h3 data-edit contenteditable="false" data-f="name">' + esc(m.name || '模组名称') + '</h3>' +
      '<label class="field"><span>组件码</span><input class="code" data-f="code" placeholder="选填，可留空" readonly value="' + esc(m.code || '') + '"></label>' +
      '<label class="field price"><span>售价</span><input class="price-in" data-f="price" placeholder="选填" readonly value="' + esc(m.price || '') + '"></label>' +
      '<button class="px-btn small danger edit-only" data-act="del" type="button">🗑 删除</button>' +
    '</article>';
  }
  function tplGal(g){
    g = g || {};
    return '<figure class="item glass" data-type="gal" data-cat="' + esc(cardCat('gal', g.cat)) + '">' +
      imgWrapHTML('', '建筑截图', g.img) +
      '<div class="tag-row">' + catChipHTML('gal', g.cat) + '</div>' +
      '<h3 data-edit contenteditable="false" data-f="name">' + esc(g.name || '建筑名称') + '</h3>' +
      '<p class="desc" data-edit contenteditable="false" data-f="desc">' + esc(g.desc || '') + '</p>' +
      buildersHTML(g.builders) +
      '<button class="px-btn small danger edit-only" data-act="del" type="button">🗑 删除</button>' +
    '</figure>';
  }
  function tplMember(m){
    m = m || {};
    return '<article class="item glass" data-type="member">' +
      imgWrapHTML('sq', '成员头像', m.img) +
      '<h3 data-edit contenteditable="false" data-f="name">' + esc(m.name || 'Steve_ID') + '</h3>' +
      '<div class="role" data-edit contenteditable="false" data-f="role">' + esc(m.role || '分工：主建筑师') + '</div>' +
      '<button class="px-btn small danger edit-only" data-act="del" type="button">🗑 删除</button>' +
    '</article>';
  }
  function tplLog(o){
    o = o || {};
    return '<article class="tl-item" data-cat="' + esc(o.cat || '建筑') + '" data-date="' + esc(o.date || '') + '"><span class="tl-node"></span>' +
      '<div class="tl-card item glass' + (o.img ? ' has-img' : '') + '">' +
        '<div class="tl-meta">' +
          '<time data-edit contenteditable="false">' + esc(o.date || '') + '</time>' +
          (o.stage ? '<span class="stage" data-edit contenteditable="false">' + esc(o.stage) + '</span>' : '') +
          '<button class="cat-chip" data-act="log-cat" data-c="' + esc(o.cat || '建筑') + '" type="button" title="编辑模式下点击切换分类">' + esc(o.cat || '建筑') + '</button>' +
        '</div>' +
        '<h3 data-edit contenteditable="false">' + esc(o.title || '') + '</h3>' +
        '<p class="desc" data-edit contenteditable="false">' + esc(o.body || '') + '</p>' +
        buildersHTML(o.builders) +
        (o.img ? logImgHTML(o.img) : '') +
        '<div class="tools edit-only">' +
          '<button class="px-btn small gray add-img" data-act="log-addimg" type="button">＋ 配图</button>' +
          '<button class="px-btn small gray rm-img" data-act="log-rmimg" type="button">✕ 移除图片</button>' +
          '<button class="px-btn small danger" data-act="log-del" type="button">🗑 删除</button>' +
        '</div>' +
      '</div></article>';
  }

  /* ============ 渲染（数据 → DOM） ============ */
  function renderAll(){
    var d = currentData;

    $$('[data-bind]').forEach(function(el){
      var v = getPath(d, el.getAttribute('data-bind'));
      if(v != null) el.textContent = v;

    applyBg(d.meta && d.meta.bgImage);

    renderSplit('map', d.sections && d.sections.map);
    renderSplit('story', d.sections && d.sections.story);

    $('#modGrid').innerHTML  = (d.mods || []).map(tplMod).join('');
    $('#galGrid').innerHTML  = (d.gallery || []).map(tplGal).join('');
    $('#teamGrid').innerHTML = (d.team || []).map(tplMember).join('');

    var tl = $('#tl');
    if(tl){
      tl.innerHTML = (d.logs || []).map(tplLog).join('');

    $$('.img-wrap img').forEach(syncImg);

  /* 模组 / 作品：分类筛选 */
  function renderCards(g, replay){
    var c = CARD[g], grid = $(c.grid); if(!grid) return;
    var items = $$(c.sel, grid), f = cardFilter[g];
    items.forEach(function(it){
      var chip = $('.cat-chip', it), cat = chip ? chip.textContent.trim() : '';

    grid.setAttribute('data-empty', vis.length ? '0' : '1');
    $$('.tl-filters[data-g="' + g + '"] .chip').forEach(function(ch){
      var ff = ch.getAttribute('data-f');

      ch.setAttribute('data-n', ff === 'all' ? items.length : items.filter(function(it){ return it.getAttribute('data-cat') === ff; }).length);
    });

      vis.forEach(function(it, i){

  /* ============ 收集（DOM → 数据） ============ */
  function collectData(){
    var d = deepClone(currentData);

    // 临时显示所有日志项，确保 innerText 能取到换行
    var tl = $('#tl');
    var hiddenState = [];
    $$('.tl-item, #modGrid .item, #galGrid .item').forEach(function(it){ hiddenState.push([it, it.hidden]); it.hidden = false; });

    $$('[data-bind]').forEach(function(el){
      setPath(d, el.getAttribute('data-bind'), textOf(el));
    });

    var bgv = $('#bg').style.getPropertyValue('--bg-image');
    var m = bgv.match(/url\("?(.*?)"?\)/);
    d.meta.bgImage = m ? m[1] : '';

    ['map','story'].forEach(function(k){
      var sec = document.getElementById(k);
      if(!sec) return;
      if(!d.sections) d.sections = {};
      if(!d.sections[k]) d.sections[k] = {};
      var split = $('.split', sec);
      var textBox = $('.text [data-edit]', split);
      var img = $('.img-wrap img', split);
      d.sections[k].html = textBox ? textBox.innerHTML : '';
      d.sections[k].reversed = split.classList.contains('reverse');
      d.sections[k].image = img ? (img.getAttribute('src') || '') : '';
      d.sections[k].en = $('.sec-title .en', sec) ? textOf($('.sec-title .en', sec)) : d.sections[k].en;
      d.sections[k].title = $('.sec-title [data-edit]', sec) ? textOf($('.sec-title [data-edit]', sec)) : d.sections[k].title;
    });

    d.mods = $$('#modGrid [data-type="mod"]').map(function(el){
      return {
        name: textOf($('[data-f="name"]', el)),
        cat: textOf($('.cat-chip', el)) || CARD.mod.cats[0],
        code: $('[data-f="code"]', el).value.trim(),
        price: $('[data-f="price"]', el).value.trim()
      };
    });

    d.gallery = $$('#galGrid [data-type="gal"]').map(function(el){
      return {
        name: textOf($('[data-f="name"]', el)),
        desc: textOf($('[data-f="desc"]', el)),
        cat: textOf($('.cat-chip', el)) || CARD.gal.cats[0],
        builders: buildersOf(el),
        img: imgSrcOf(el)
      };
    });

    d.team = $$('#teamGrid [data-type="member"]').map(function(el){
      return {
        name: textOf($('[data-f="name"]', el)),
        role: textOf($('[data-f="role"]', el)),
        img: imgSrcOf(el)
      };
    });

    d.logs = $$('#tl .tl-item').map(function(it){
      var time = $('time', it);
      var stage = $('.stage', it);
      var cat = $('.cat-chip', it);
      var title = $('h3', it);
      var body = $('.desc', it);
      var img = $('.img-wrap img', it);
      return {
        date: time ? textOf(time) : '',
        stage: stage ? textOf(stage) : '',
        cat: cat ? textOf(cat) : '建筑',
        title: title ? textOf(title) : '',
        body: body ? textOf(body) : '',
        builders: buildersOf(it),
        img: img ? (img.getAttribute('src') || '') : ''
      };
    });

    hiddenState.forEach(function(p){ p[0].hidden = p[1]; });
    return d;
  }

  /* ============ 保存 / 导出 ============ */
  function saveDraft(){
    var d = collectData();
    d.rev = Date.now();
    try{
      localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
      currentData = d;
      toast('✓ 草稿已保存，刷新后仍可见');
    }catch(err){
      toast('保存失败：存储空间不足或被禁用', true);
    }
  }

  function downloadFile(name, text, mime){
    var blob = new Blob([text], {type: (mime || 'text/javascript') + ';charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  }

  function exportDataJS(){
    var d = collectData();
    d.rev = Date.now();
    currentData = d;
    var header =
      '/* 南风市 · 数据文件（由网站导出）\n' +
      ' *\n' +
      ' * 用法：用本文件覆盖仓库里的 data.js，然后提交即可。\n' +
      ' * 页面加载时会对比 rev：文件里的 rev 比本地草稿新时，自动使用文件数据。\n' +
      ' */\n\n';
    downloadFile('data.js', header + 'window.MC_DATA = ' + JSON.stringify(d, null, 2) + ';\n');
    toast('✓ 已导出 data.js，替换仓库文件即可');
  }

  function resetAll(){

  /* ============ 图片加载状态 ============ */

  function syncImg(img){

    else if(img.complete){ w.classList.remove('loading','ld'); w.classList.add('broken'); }
    else { w.classList.remove('ld','broken'); w.classList.add('loading'); }

  /* ============ 灯箱（左右切换 / 手机滑动 / 键盘） ============ */
  var lbEl = $('#lightbox'), lbImg = $('img', lbEl), lbCount = $('.lb-count', lbEl);
  var lbList = [], lbIdx = 0, lbX = 0, lbY = 0;
  function lbOpen(){ return lbEl.classList.contains('open'); }
  function lbShow(i){
    if(!lbList.length) return;
    lbIdx = (i + lbList.length) % lbList.length;
    var im = lbList[lbIdx];
    lbImg.src = im.currentSrc || im.src;
    lbImg.alt = im.alt || '';
    lbImg.classList.remove('swap'); void lbImg.offsetWidth; lbImg.classList.add('swap');
    lbEl.setAttribute('data-single', lbList.length < 2 ? '1' : '0');
    lbCount.textContent = lbList.length > 1 ? (lbIdx + 1) + ' / ' + lbList.length : '';
  }
  function openLB(img){
    var scope = img.closest('#galGrid') ? '#galGrid .item:not([hidden]) .img-wrap img'
              : img.closest('#tl') ? '#tl .tl-item:not([hidden]) .img-wrap img' : null;
    lbList = scope ? $$(scope).filter(function(m){ return m.getAttribute('src'); }) : [img];
    lbShow(Math.max(0, lbList.indexOf(img)));
    lbEl.classList.add('open');
    document.documentElement.classList.add('lb-lock');
  }
  function closeLB(){ lbEl.classList.remove('open'); document.documentElement.classList.remove('lb-lock'); }
  function lbClick(e){
    var b = e.target.closest('.lb-nav');
    if(b && b.classList.contains('lb-prev')) lbShow(lbIdx - 1);
    else if(b && b.classList.contains('lb-next')) lbShow(lbIdx + 1);
    else closeLB();
  }
  lbEl.addEventListener('touchstart', function(e){ var t = e.changedTouches[0]; lbX = t.clientX; lbY = t.clientY; }, {passive:true});
  lbEl.addEventListener('touchend', function(e){
    var t = e.changedTouches[0], dx = t.clientX - lbX, dy = t.clientY - lbY;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) lbShow(lbIdx + (dx < 0 ? 1 : -1));
  }, {passive:true});
  document.addEventListener('keydown', function(e){
    if(!lbOpen()) return;
    if(e.key === 'Escape') closeLB();
    else if(e.key === 'ArrowLeft') lbShow(lbIdx - 1);
    else if(e.key === 'ArrowRight') lbShow(lbIdx + 1);
  });

  /* ============ 建造人员选择（名单取自「人员规划」） ============ */
  var pickModal = $('#pickModal'), pickTarget = null;
  function teamList(){
    return $$('#teamGrid [data-type="member"]').map(function(m){
      return {name: textOf($('[data-f="name"]', m)), role: textOf($('[data-f="role"]', m))};
    }).filter(function(x){ return x.name; });
  }
  function currentBuilders(el){
    try{ var a = JSON.parse(el.getAttribute('data-builders') || '[]'); return Array.isArray(a) ? a : []; }
    catch(e){ return []; }
  }
  function buildersOf(root){ var b = $('.builders', root); return b ? currentBuilders(b) : []; }
  function setBuilders(el, arr){
    el.setAttribute('data-builders', JSON.stringify(arr));
    $('.b-list', el).innerHTML = arr.map(function(n){ return '<span class="b-chip">' + esc(n) + '</span>'; }).join('');
    el.classList.toggle('empty', !arr.length);
  }
  function fillPickList(box, selected){
    selected = selected || [];
    box.innerHTML = '';
    var list = teamList(), names = list.map(function(x){ return x.name; });
    selected.forEach(function(n){ if(names.indexOf(n) < 0) list.push({name:n, role:'（已不在人员名单中）'}); });
    if(!list.length){ box.textContent = '人员规划里还没有成员，请先在页面下方添加。'; return; }
    list.forEach(function(m){
      var l = document.createElement('label'); l.className = 'pick-item';
      var i = document.createElement('input'); i.type = 'checkbox'; i.value = m.name; i.checked = selected.indexOf(m.name) >= 0;
      var t = document.createElement('span'); t.className = 'pi-t';
      var a = document.createElement('b'); a.textContent = m.name;
      var r = document.createElement('small'); r.textContent = m.role;
      t.appendChild(a); t.appendChild(r); l.appendChild(i); l.appendChild(t);
      l.classList.toggle('on', i.checked);
      i.addEventListener('change', function(){ l.classList.toggle('on', i.checked); });
      box.appendChild(l);
    });
  }
  function readPickList(box){ return $$('input:checked', box).map(function(i){ return i.value; }); }

    pickTarget = el;

    pickModal.classList.add('open');

  $('#pickOk').addEventListener('click', function(){

    closePicker();
  });
  $('#pickClear').addEventListener('click', function(){
    $$('#pickList input').forEach(function(i){ i.checked = false; i.closest('.pick-item').classList.remove('on'); });
  });
  $('#pickCancel').addEventListener('click', closePicker);
  pickModal.addEventListener('click', function(e){ if(e.target === pickModal) closePicker(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && pickModal.classList.contains('open')) closePicker(); });

  /* ============ 点击（主） ============ */
  document.addEventListener('click', function(e){
    if(lbOpen()){ lbClick(e); return; }

    var btn = e.target.closest('[data-act]');
    if(!btn){
      var img = e.target.closest('#galGrid .img-wrap img');
      if(img && !editing && img.getAttribute('src')) openLB(img);
      return;
    }
    var act = btn.getAttribute('data-act');

    if(!editing) return;

    if(act === 'swap'){
      var im2 = btn.closest('.img-wrap').querySelector('img');
      var url = prompt('请输入图片链接（图床 URL）：', im2.getAttribute('src') || '');
      if(url !== null){
        im2.parentNode.classList.remove('broken');
        im2.parentNode.classList.remove('ld');
        im2.setAttribute('src', url.trim());
        syncImg(im2);
        toast(url.trim() ? '图片链接已更新' : '已清空图片链接');
      }
    }else if(act === 'flip'){
      btn.closest('.split').classList.toggle('reverse');
    }else if(act === 'add-mod'){ addItem('#modGrid', tplMod());
    }else if(act === 'add-gal'){ addItem('#galGrid', tplGal());
    }else if(act === 'add-member'){ addItem('#teamGrid', tplMember());
    }else if(act === 'del'){
      if(confirm('确定删除这一项吗？')){ btn.closest('.item').remove(); renderStats(false); renderCards('mod'); renderCards('gal'); }
    }else if(act === 'pick-builders'){
      openPicker(btn.closest('.builders'));
    }else if(act === 'card-cat'){
      var gk = btn.getAttribute('data-g'), cs = CARD[gk].cats;
      var ci = (cs.indexOf(btn.textContent.trim()) + 1) % cs.length;
      btn.textContent = cs[ci]; btn.setAttribute('data-c', cs[ci]); renderCards(gk);
    }else if(act === 'save'){ saveDraft();
    }else if(act === 'export-js'){ exportDataJS();

      var cur = $('#bg').style.getPropertyValue('--bg-image');
      var mm = cur.match(/url\("?(.*?)"?\)/);
      var u = prompt('请输入背景图链接（留空则恢复默认背景）：', mm ? mm[1] : '');
      if(u !== null) applyBg(u.trim());
    }else if(act === 'reset'){ resetAll();

  });

  function addItem(sel, html){

  /* ============ 动效 ============ */
  var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  var progress = rt(document.createElement('div')); progress.id = 'progress';
  document.body.appendChild(progress);
  var toTop = rt(document.createElement('button'));
  toTop.type = 'button'; toTop.className = 'px-btn to-top'; toTop.textContent = '▲';
  toTop.setAttribute('aria-label', '回到顶部');
  document.body.appendChild(toTop);
  toTop.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });

  var lastActive = null, ticking = false;
  function updateScroll(){
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    var h = document.documentElement.scrollHeight - window.innerHeight;
    progress.style.transform = 'scaleX(' + (h > 0 ? Math.min(1, y / h) : 0) + ')';
    var hd = $('header.top'); if(hd) hd.classList.toggle('scrolled', y > 30);
    toTop.classList.toggle('show', y > 500);
    var secs = $$('main section'), cur = null;
    secs.forEach(function(s){ if(s.getBoundingClientRect().top <= 170) cur = s.id; });
    if(h > 0 && y >= h - 4 && secs.length) cur = secs[secs.length-1].id;
    if(cur !== lastActive){
      lastActive = cur;
      var nav = $('nav.menu');
      $$('nav.menu a').forEach(function(a){
        var on = a.getAttribute('href') === '#' + cur;
        a.classList.toggle('active', on);
        if(on && nav && nav.scrollWidth > nav.clientWidth){
          nav.scrollTo({left: a.offsetLeft - nav.clientWidth/2 + a.clientWidth/2, behavior:'smooth'});
        }
      });
    }
  }
  window.addEventListener('scroll', function(){
    if(!ticking){ ticking = true; requestAnimationFrame(function(){ ticking = false; updateScroll(); }); }

  var revealIO = ('IntersectionObserver' in window) ? new IntersectionObserver(function(es){

  function renderStats(animate){
    var hero = $('.hero'); if(!hero) return;
    var box = $('.stats', hero);
    if(!box){
      box = rt(document.createElement('div')); box.className = 'stats';
      var go = $('.go', hero);
      if(go) go.insertAdjacentElement('afterend', box); else hero.appendChild(box);
    }
    var defs = [
      ['#modGrid [data-type="mod"]', '收藏模组'],
      ['#galGrid [data-type="gal"]', '展出作品'],
      ['#tl .tl-item', '建造日志'],

    box.innerHTML = defs.map(function(d){
      var g = $(d[0]), n = g ? document.querySelectorAll(d[0]).length : 0;

    }
  }

  document.addEventListener('pointermove', function(e){
    if(e.pointerType !== 'mouse' || !e.target.closest) return;
    var card = e.target.closest('.item,.split'); if(!card) return;
    var r = card.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    card.style.setProperty('--mx', x + 'px'); card.style.setProperty('--my', y + 'px');
    if(!editing && card.classList.contains('item')){
      var rx = (y / r.height - .5) * -7, ry = (x / r.width - .5) * 7;
      card.style.transform = 'perspective(800px) rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg) translateY(-6px)';
    }
  }, {passive:true});
  document.addEventListener('pointerout', function(e){
    if(!e.target.closest) return;
    var card = e.target.closest('.item,.split');
    if(card && !card.contains(e.relatedTarget)){
      card.style.transform = ''; card.style.removeProperty('--mx'); card.style.removeProperty('--my');
    }
  });

  /* ============ 昼夜主题 ============ */
  var fx = {};
  function isDay(){ return document.documentElement.getAttribute('data-theme') === 'day'; }
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    var tc = $('meta[name="theme-color"]'); if(tc) tc.setAttribute('content', t === 'day' ? '#6fc3f3' : '#0d1b2a');
    var b = $('.theme-btn');
    if(b){
      b.textContent = t === 'day' ? '🌙' : '☀️';
      b.title = t === 'day' ? '切换到夜晚' : '切换到白天';
      b.setAttribute('aria-label', b.title);
    }
    if(fx.rebuild) fx.rebuild();
  }
  function toggleTheme(){
    var next = isDay() ? 'night' : 'day';
    try{ localStorage.setItem('mc_theme', next); }catch(e){}
    if(reduce){ applyTheme(next); return; }
    var f = rt(document.createElement('div'));
    f.className = 'theme-flash ' + next;
    document.body.appendChild(f);
    setTimeout(function(){ applyTheme(next); }, 280);
    setTimeout(function(){ f.remove(); }, 750);
  }
  function initTheme(){
    $$('[data-rt]', app).forEach(function(n){ n.remove(); });
    var hd = $('header.top'); if(!hd) return;
    var b = rt(document.createElement('button'));
    b.type = 'button'; b.className = 'px-btn small gray theme-btn';
    hd.appendChild(b);
    b.addEventListener('click', toggleTheme);
    applyTheme(isDay() ? 'day' : 'night');
  }

  /* ============ 打字机 ============ */
  var tw = null;
  function finishTypewriter(){
    if(!tw || tw.done) return;
    tw.done = true; clearTimeout(tw.t); tw.el.textContent = tw.full;
  }
  function startTypewriter(){
    var p = $('.hero p[data-edit]'); if(!p) return;
    p.classList.add('typing');
    if(reduce || editing) return;
    tw = {el:p, full:p.textContent, done:false, t:null};
    p.textContent = '';
    var i = 0;
    tw.t = setTimeout(function tick(){
      if(tw.done) return;
      i++; p.textContent = tw.full.slice(0, i);
      if(i >= tw.full.length){ tw.done = true; return; }
      var ch = tw.full.charAt(i - 1);
      tw.t = setTimeout(tick, 38 + Math.random() * 42 + (/[，。,.！？]/.test(ch) ? 220 : 0));
    }, 600);
  }

  /* ============ 日志 ============ */
  var CATS = ['建筑', '轨道交通', '道路', '地形', '优化'];
  var curFilter = 'all';

  function getLogDate(it){
    var t = $('time', it), m = t && t.textContent.match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
    return m ? m[1] + '-' + ('0'+m[2]).slice(-2) + '-' + ('0'+m[3]).slice(-2) : (it.getAttribute('data-date') || '');
  }
  function sortLog(){
    var tl = $('#tl'); if(!tl) return;
    var arr = $$('.tl-item', tl);
    arr.forEach(function(it){ it.setAttribute('data-date', getLogDate(it)); });
    arr.map(function(it, i){ return [it, i]; }).sort(function(a, b){
      var x = a[0].getAttribute('data-date'), y = b[0].getAttribute('data-date');
      return x < y ? 1 : x > y ? -1 : a[1] - b[1];
    }).forEach(function(p){ tl.appendChild(p[0]); });
  }
  function renderLog(){
    var tl = $('#tl'); if(!tl) return;
    var all = $$('.tl-item', tl), n = all.length;
    all.forEach(function(it, i){
      var a = n > 1 ? 1 - .72 * (i / (n - 1)) : 1;
      var a2 = n > 1 ? 1 - .72 * ((i + 1) / (n - 1)) : 1;
      it.style.setProperty('--a', a.toFixed(2));
      it.style.setProperty('--a2', Math.max(.28, a2).toFixed(2));
      it.classList.toggle('first', i === 0);
      var card = $('.tl-card', it); if(card) card.classList.toggle('has-img', !!$('.img-wrap', card));
      var cat = $('.cat-chip', it); if(cat) it.setAttribute('data-cat', cat.textContent.trim());
      it.hidden = !(curFilter === 'all' || it.getAttribute('data-cat') === curFilter);
    });
    var vis = all.filter(function(it){ return !it.hidden; });
    all.forEach(function(it){ it.classList.remove('last'); });
    if(vis.length) vis[vis.length - 1].classList.add('last');
    tl.setAttribute('data-empty', vis.length ? '0' : '1');
    $$('.tl-filters[data-g="log"] .chip').forEach(function(c){
      var f = c.getAttribute('data-f');
      c.classList.toggle('active', f === curFilter);
      c.setAttribute('data-n', f === 'all' ? n : all.filter(function(it){ return it.getAttribute('data-cat') === f; }).length);
    });
  }
  function replayLog(){
    var k = 0;
    $$('.tl-item:not([hidden]) .tl-card').forEach(function(c){
      c.style.setProperty('--d', (k++ * 70) + 'ms');
      c.classList.remove('in'); void c.offsetWidth; c.classList.add('in');
    });
  }
  var litIO = ('IntersectionObserver' in window) ? new IntersectionObserver(function(es){
    var k = 0;
    es.filter(function(en){ return en.isIntersecting; })
      .sort(function(a, b){ return a.boundingClientRect.top - b.boundingClientRect.top; })
      .forEach(function(en){
        en.target.style.setProperty('--ld', (k++ * 260) + 'ms');
        en.target.classList.add('lit'); litIO.unobserve(en.target);
      });
  }, {threshold:.15, rootMargin:'0px 0px -8% 0px'}) : null;
  function observeOne(it){ it.classList.remove('lit'); if(litIO) litIO.observe(it); else it.classList.add('lit'); }
  function observeLog(){ $$('.tl-item').forEach(observeOne); }

  /* 日志表单 */
  var modal = $('#logModal');
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth()+1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function openLogForm(){
    $('#lfDate').value = todayStr(); $('#lfStage').value = ''; $('#lfCat').value = CATS[0];
    $('#lfTitle').value = ''; $('#lfBody').value = ''; $('#lfImg').value = ''; $('#lfMsg').textContent = ''; fillPickList($('#lfBuilders'), []);
    modal.classList.add('open');
    setTimeout(function(){ $('#lfTitle').focus(); }, 60);
  }
  function closeLogForm(){ modal.classList.remove('open'); }
  $('#lfCancel').addEventListener('click', closeLogForm);
  modal.addEventListener('click', function(e){ if(e.target === modal) closeLogForm(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && modal.classList.contains('open')) closeLogForm(); });
  $('#logFormEl').addEventListener('submit', function(e){
    e.preventDefault();
    if(!editing){ closeLogForm(); return; }
    var title = $('#lfTitle').value.trim();
    if(!title){ $('#lfMsg').textContent = '请填写标题'; $('#lfTitle').focus(); return; }
    var o = {
      date: $('#lfDate').value || todayStr(), stage: $('#lfStage').value.trim(), cat: $('#lfCat').value,
      title: title, body: $('#lfBody').value.trim() || '（暂无正文）', builders: readPickList($('#lfBuilders')), img: $('#lfImg').value.trim()
    };
    var tl = $('#tl');
    if(curFilter !== 'all' && curFilter !== o.cat) curFilter = 'all';
    tl.insertAdjacentHTML('afterbegin', tplLog(o));
    var it = tl.firstElementChild;
    var imgEl = $('img', it); if(imgEl) syncImg(imgEl);
    sortLog(); renderLog(); observeOne(it);
    prep($('.tl-card', it), 0);
    applyEditingState();
    renderStats(false); closeLogForm(); toast('✓ 日志已添加');
    it.scrollIntoView({behavior:'smooth', block:'center'});
  });

  /* 点击（日志） */
  document.addEventListener('click', function(e){
    if(!e.target.closest) return;
    var b = e.target.closest('[data-act]');
    if(!b){
      var im = e.target.closest('.tl-card .img-wrap img');
      if(im && !editing && im.getAttribute('src')) openLB(im);
      return;
    }
    var act = b.getAttribute('data-act');
    if(act === 'filter'){
      var grp = b.closest('.tl-filters').getAttribute('data-g');
      if(grp === 'log'){ curFilter = b.getAttribute('data-f'); renderLog(); replayLog(); }
      else { cardFilter[grp] = b.getAttribute('data-f'); renderCards(grp, true); }
      return;
    }
    if(!editing) return;
    var it = b.closest('.tl-item');
    if(act === 'add-log'){ openLogForm(); }
    else if(act === 'log-sort'){ sortLog(); renderLog(); toast('已按日期排序'); }
    else if(act === 'log-cat'){
      var i = (CATS.indexOf(b.textContent.trim()) + 1) % CATS.length;
      b.textContent = CATS[i]; b.setAttribute('data-c', CATS[i]); renderLog();
    }
    else if(act === 'log-del'){
      if(confirm('确定删除这条日志吗？')){ it.remove(); renderLog(); renderStats(false); }
    }
    else if(act === 'log-addimg'){
      var url = prompt('请输入图片链接（图床 URL，可先留空稍后再填）：', '');
      if(url === null) return;
      var card = $('.tl-card', it);
      $('.tools', card).insertAdjacentHTML('beforebegin', logImgHTML(url.trim()));
      var im2 = $('img', card); if(im2) syncImg(im2);
      renderLog();
    }
    else if(act === 'log-rmimg'){
      if(confirm('移除这张图片？')){ var w = $('.img-wrap', it); if(w) w.remove(); renderLog(); }
    }
  });

  /* ============ 背景特效 ============ */
  function startFX(){
    var cv = rt(document.createElement('canvas'));
    cv.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;z-index:-1;pointer-events:none';
    document.body.appendChild(cv);
    var ctx = cv.getContext('2d'); if(!ctx) return;
    var W = 0, H = 0, motes = [], stars = [], clouds = [], streaks = [], city = [], wins = [];
    var DAYC = ['#ffffff','#ffe9a8','#d9f5c8','#ffffff'], NIGHTC = ['#9dff9d','#ffd24a','#bfe3f7','#ffffff'];
    var SHAPE = [[2,-1,2,1],[1,0,3,1],[0,1,5,1]];
    var sy = 0, applied = NaN, spawn = 20, last = 0, heroEls = [];
    [['.hero .logo.big',.30],['.hero h2',.18],['.hero p',.12],['.hero .stats',.07]].forEach(function(h){
      var el = $(h[0]); if(el) heroEls.push([el, h[1]]);
    });
    function rnd(a, b){ return a + Math.random() * (b - a); }
    function mod(a, n){ return ((a % n) + n) % n; }

    function buildCity(){
      city = []; wins = [];
      var x = -8;
      while(x < W){
        var w = (2 + ((Math.random() * 3) | 0)) * 16, h = (3 + ((Math.random() * 6) | 0)) * 16;
        city.push({x:x, w:w, h:h});
        for(var wy = 18; wy < h - 10; wy += 18) for(var wx = 8; wx < w - 12; wx += 16) wins.push({x:x + wx, y:wy - h, on:Math.random() < .5});
        x += w + ((Math.random() * 3) | 0) * 8;
      }
    }
    function layout(force){
      var nw = window.innerWidth, nh = window.innerHeight;
      if(!force && nw === W && Math.abs(nh - H) < 120) return;
      W = cv.width = nw; H = cv.height = nh; ctx.imageSmoothingEnabled = false;
      var small = W < 760, day = isDay(), i;
      var nm = day ? (small ? 16 : 36) : (small ? 12 : 24), ns = day ? 0 : (small ? 16 : 32);
      motes = []; for(i = 0; i < nm; i++) motes.push({x:rnd(0,W), y:rnd(0,H+16), s:Math.random() < .7 ? 2 : 4, vy:rnd(.12,.45), ph:rnd(0,6.28), sp:rnd(.4,1.2), ci:(Math.random()*4)|0, a:rnd(.4,.9), z:rnd(.4,1)});
      stars = []; for(i = 0; i < ns; i++) stars.push({x:rnd(0,W), y:rnd(0,H), s:Math.random() < .8 ? 2 : 4, ph:rnd(0,6.28), z:rnd(.2,1)});
      clouds = []; for(i = 0; i < (day ? 5 : 4); i++) clouds.push({x:rnd(0,W), y:rnd(30,H*.5), u:((Math.random()*3)|0)*4 + 8, v:rnd(.08,.22)});
      buildCity();
      if(reduce) draw(0, 0);
    }

    function draw(ts, dt){
      var day = isDay(), i, u, cx, cy;
      ctx.clearRect(0, 0, W, H); ctx.globalAlpha = 1;
      if(day){
        cx = Math.round(W * .86); cy = Math.round(84 - sy * .08); u = 10;
        ctx.fillStyle = 'rgba(255,236,160,.2)'; ctx.fillRect(cx - 5*u, cy - 5*u, 11*u, 11*u);
        ctx.fillStyle = 'rgba(255,236,160,.22)'; ctx.fillRect(cx - 4*u, cy - 4*u, 9*u, 9*u);
        ctx.fillStyle = '#ffd24a';
        [[-1,-2,3,1],[-2,-1,5,3],[-1,2,3,1]].forEach(function(r){ ctx.fillRect(cx + r[0]*u, cy + r[1]*u, r[2]*u, r[3]*u); });
        ctx.fillStyle = '#fff3b0'; ctx.fillRect(cx - u, cy - u, u, u);
        ctx.globalAlpha = .6 + .4 * Math.sin(ts / 700); ctx.fillStyle = '#ffe27a';
        [[0,-4],[0,4],[-4,0],[4,0],[-3,-3],[3,-3],[-3,3],[3,3]].forEach(function(r){ ctx.fillRect(cx + r[0]*u, cy + r[1]*u, u, u); });
        ctx.globalAlpha = 1;
      }else{
        ctx.fillStyle = '#fff';
        for(i = 0; i < stars.length; i++){
          var s = stars[i];
          ctx.globalAlpha = .3 + .7 * Math.abs(Math.sin(ts / 900 + s.ph));
          ctx.fillRect(Math.round(s.x), Math.round(mod(s.y - sy * .08 * s.z, H)), s.s, s.s);
        }
        ctx.globalAlpha = .85; ctx.fillStyle = '#f4f1d0';
        cx = Math.round(W * .84); cy = Math.round(90 - sy * .06); u = 8;
        [[2,0,2],[1,1,2],[0,2,2],[0,3,2],[1,4,2],[2,5,2]].forEach(function(r){ ctx.fillRect(cx + r[0]*u, cy + r[1]*u, r[2]*u, u); });
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = day ? 'rgba(255,255,255,.78)' : 'rgba(255,255,255,.06)';
      clouds.forEach(function(c){
        c.x += c.v * dt; if(c.x > W + c.u * 6) c.x = -c.u * 6;
        var y = mod(c.y - sy * .12, H * .6) + 20;
        SHAPE.forEach(function(r){ ctx.fillRect(Math.round(c.x + r[0]*c.u), Math.round(y + r[1]*c.u), r[2]*c.u, r[3]*c.u); });
      });
      if(!day){
        ctx.fillStyle = 'rgba(8,16,32,.88)';
        for(i = 0; i < city.length; i++) ctx.fillRect(city[i].x, H - city[i].h, city[i].w, city[i].h);
        if(dt > 0 && wins.length && Math.random() < .05){ var fw = wins[(Math.random() * wins.length) | 0]; fw.on = !fw.on; }
        ctx.globalAlpha = .85; ctx.fillStyle = '#ffd24a';
        for(i = 0; i < wins.length; i++) if(wins[i].on) ctx.fillRect(wins[i].x, H + wins[i].y, 6, 8);
        ctx.globalAlpha = 1;
      }
      var pal = day ? DAYC : NIGHTC;
      motes.forEach(function(m){
        m.y -= m.vy * dt; m.x += Math.sin(ts / 1000 * m.sp + m.ph) * .35 * dt;
        ctx.globalAlpha = m.a * (.6 + .4 * Math.sin(ts / 600 + m.ph));
        ctx.fillStyle = pal[m.ci % pal.length];
        ctx.fillRect(Math.round(mod(m.x, W)), Math.round(mod(m.y - sy * .25 * m.z, H + 16) - 8), m.s, m.s);
      });
      ctx.globalAlpha = 1;
      if(dt > 0){
        spawn -= dt;
        if(spawn <= 0 && streaks.length < 4){ streaks.push({x:-160, y:rnd(40, H - 40), len:rnd(60,140), v:rnd(4,7)}); spawn = rnd(40,110); }
      }
      ctx.fillStyle = day ? 'rgba(255,255,255,.55)' : 'rgba(232,246,255,.22)';
      for(i = streaks.length - 1; i >= 0; i--){
        var st = streaks[i]; st.x += st.v * dt;
        for(var k = 0; k < st.len; k += 10) ctx.fillRect(Math.round(st.x + k), Math.round(st.y - k * .06), 6, 2);
        if(st.x > W) streaks.splice(i, 1);
      }
    }

    fx.rebuild = function(){ layout(true); };
    fx.clearParallax = function(){ heroEls.forEach(function(p){ p[0].style.translate = ''; }); applied = NaN; };
    window.addEventListener('resize', function(){ layout(false); });
    layout(true);
    if(reduce) return;

    function applyHero(){
      var s = Math.min(sy, 900);
      heroEls.forEach(function(p){ p[0].style.translate = '0 ' + (s * p[1]).toFixed(1) + 'px'; });
    }
    function frame(ts){
      if(W < 760 && ts - last < 30){ requestAnimationFrame(frame); return; }
      var dt = Math.min(50, ts - last) / 16.67; last = ts;
      var ty = window.pageYOffset || 0;
      sy += (ty - sy) * Math.min(1, .12 * dt);
      if(Math.abs(sy - applied) > .2){ applied = sy; applyHero(); }
      draw(ts, dt);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ============ 启动 ============ */
  setEditing(false);
  renderAll();
  initTheme();
  renderStats(true);
  updateScroll();
  startTypewriter();
  startFX();
})();
</script>
</body>
</html>
